name: Deploy launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    if: false && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validation.yml
    with:
      release: true
  security:
    if: false && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
  deploy-launcher:
    needs: [checks, security]
    if: false && github.ref == 'refs/heads/main' && vars.SLICE_LAUNCHER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: slice-launcher-production
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.checks.outputs.artifact-id }}
          merge-multiple: true
      - name: Verify exact source and artifact contents
        env:
          EXPECTED_CONTENT_DIGEST: ${{ needs.checks.outputs.content-digest }}
        run: |
          test -n "$EXPECTED_CONTENT_DIGEST"
          node scripts/release-artifact.mjs verify apps/launcher/dist release-manifest.json "$GITHUB_SHA"
      - name: Skip superseded commits
        id: revision
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$current"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: main advanced beyond $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Promote validated Worker and verify production
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SLICE_LAUNCHER_URL: ${{ vars.SLICE_LAUNCHER_URL }}
          ACCESS_TEAM_DOMAIN: https://snowy-voice-36a1.cloudflareaccess.com
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          RELEASE_ARTIFACT_ID: ${{ needs.checks.outputs.artifact-id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.checks.outputs.artifact-digest }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/wrangler-output.ndjson
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          test -n "$SLICE_LAUNCHER_URL"
          pnpm --filter @slice/launcher exec wrangler deploy --config dist/server/wrangler.json --no-bundle --message "source:$GITHUB_SHA"
          node scripts/check-launcher.mjs "$SLICE_LAUNCHER_URL"
          pnpm --filter @slice/launcher exec wrangler deployments status --name slice-launcher --json > deployment.json
          node scripts/release-provenance.mjs record
      - name: Record verified release provenance
        if: steps.revision.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: |
            verified-release.json
            release-manifest.json
            deployment.json
          retention-days: 90
          if-no-files-found: error
      - name: Failure remains visible
        if: failure()
        run: echo "Production release failed. Inspect this run; no automatic rollback occurred." >> "$GITHUB_STEP_SUMMARY"
