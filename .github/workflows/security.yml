name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: always
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results/*.sarif
          retention-days: 7
          if-no-files-found: error
  severity-gate:
    needs: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codeql-*
          path: sarif-results
          merge-multiple: true
      - name: Enforce high-severity findings without privileged credentials
        run: node scripts/check-sarif.mjs sarif-results
  security:
    if: always()
    needs: [dependency-review, codeql, severity-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require scanners to finish successfully
        env:
          SEVERITY: ${{ needs.severity-gate.result }}
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCY: ${{ needs.dependency-review.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$CODEQL" = success
          test "$SEVERITY" = success
          if [ "$EVENT" = pull_request ]; then
            test "$DEPENDENCY" = success
          else
            test "$DEPENDENCY" = skipped
          fi
